server:
  port: 8080

spring:
  application:
    name: tablestake-backend
  datasource:
    url: jdbc:h2:mem:tablestake;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.tablestake: INFO
